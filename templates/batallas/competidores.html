{% extends 'base.html' %}{% block content %}<h1>Competidores</h1><section class="card"><form method="post" class="form">{% csrf_token %}<input name="nombre" placeholder="Nombre del MC" required><select name="liga" required><option value="">Seleccionar FMS</option>{% for l in ligas %}<option value="{{l.id}}">{{l.nombre}}</option>{% endfor %}</select><button class="btn primary">Agregar MC</button></form></section><section class="card"><table><tr><th>MC</th><th>FMS</th><th>Puntos</th><th>Batallas</th><th>Puntos a favor</th></tr>{% for c in competidores %}<tr><td>{{c.nombre}}</td><td>{{c.liga.nombre}}</td><td>{{c.puntos}}</td><td>{{c.batallas}}</td><td>{{c.puntos_favor}}</td></tr>{% empty %}<tr><td colspan="5">No hay MC registrados.</td></tr>{% endfor %}</table></section>{% endblock %}
